[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "utu"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "A Python library of solar physics utilities built on named arrays"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "astropy",
    "named-arrays~=2.8",
    "fiasco~=0.8.2",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-doctestplus",
]
doc = [
    "matplotlib",
    "graphviz",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "sphinx-favicon",
    "sphinx-codeautolink",
]

[project.urls]
Homepage = "https://github.com/sun-data/utu"
Documentation = "https://utu.readthedocs.io"

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # a copyright notice at the top of every file, which nothing here has
    "CPY001",
    # a summary on the line the quotes are on, where everything here puts it
    # on the line below
    "D212",
    # `None` last in a union, where everything here writes it first
    "RUF036",
    # a limit on how many arguments a function may take, which the ones
    # describing a plasma exceed by saying what the plasma is
    "PLR0913",
    "PLR0917",
    # rules the formatter decides, and which fight it if linted as well
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = [
    # the names Sphinx reads out of this file are Sphinx's to choose, and one
    # of them shadows a builtin
    "A001",
    # it is configuration rather than a module, and is not imported
    "INP001",
]
"**/_tests/*" = [
    # a test says what it means with `assert`
    "S101",
    # and needs neither annotations nor a docstring on every function
    "ANN",
    "D103",
    # nor a name for every number it compares against
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
